name: cheiro_numerology
publish_to: 'none'
description: Premium offline-first Cheiro-inspired numerology analysis app.
version: 1.0.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  crypto: ^3.0.6
  encrypt: ^5.0.3
  intl: ^0.19.0
  pdf: ^3.11.3
  printing: ^5.14.2
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  share_plus: ^10.1.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
flutter:
  uses-material-design: true
  assets:
    - assets/images/
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FAF5E8"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
