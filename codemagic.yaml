workflows:
  android-debug:
    name: Cheiro Numerology - Android test APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Generate Android platform files
        script: |
          flutter create --platforms=android --project-name cheiro_numerology --org com.cheironumerology /tmp/cheiro_scaffold
          cp -R /tmp/cheiro_scaffold/android "$CM_BUILD_DIR/android"
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build test APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
