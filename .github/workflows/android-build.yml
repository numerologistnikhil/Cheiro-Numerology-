name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Remove default generated widget test
        run: rm -f test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Set app name and launcher icon
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Ank Dhara"/' android/app/src/main/AndroidManifest.xml
          dart run flutter_launcher_icons

      - name: Static analysis (fails on errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Re-sign APK with the fixed key
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          keytool -list -keystore debug.keystore -storepass android || true
          "$BT/apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey "$APK"
          "$BT/apksigner" verify --print-certs "$APK" | head -3

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ankdhara-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Print signing fingerprint (for checking only)
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -i "SHA-256" || true
